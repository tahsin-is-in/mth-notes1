<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Courses — MTH Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('mthnotes:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-nav="courses">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <main id="main-content" class="main-content">
      <div class="page-wrap">
        <div class="section-head" style="margin-top:0;">
          <h2>All Courses</h2>
        </div>
        <p class="section-sub">Third Year Mathematics \u2014 12 courses.</p>

        <div class="filter-bar" id="filter-bar">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="has-content">With notes</button>
          <button class="filter-chip" data-filter="favorites">Favorites</button>
        </div>

        <div class="course-grid" id="course-grid">
          <p class="section-sub">Loading courses\u2026</p>
        </div>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<div id="bottom-nav-mount"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
<script>
  App.mountShell('courses');
  App.setBreadcrumbs([{ label: 'Home', url: 'index.html' }, { label: 'Courses' }]);

  let allCourses = [];
  let activeFilter = 'all';

  function renderCourses() {
    let list = allCourses;
    if (activeFilter === 'has-content') list = list.filter(c => (c.lectures || []).length > 0);
    if (activeFilter === 'favorites') list = list.filter(c => Store.isFavorite(`course:${c.slug}`));

    const grid = document.getElementById('course-grid');
    if (!list.length) {
      grid.innerHTML = UI.emptyState('\ud83d\udcda', 'No courses to show', 'Try a different filter.');
      return;
    }
    grid.innerHTML = list.map(UI.courseCard).join('');
  }

  document.getElementById('filter-bar').addEventListener('click', e => {
    const chip = e.target.closest('[data-filter]');
    if (!chip) return;
    activeFilter = chip.getAttribute('data-filter');
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
    renderCourses();
  });

  App.getCourses().then(data => {
    allCourses = data.courses;
    renderCourses();
  });
</script>
</body>
</html>
