<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exams — MTH Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('mthnotes:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-nav="courses">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <main id="main-content" class="main-content">
      <div class="page-wrap" id="exams-page-wrap">
        <p class="section-sub">Loading exams\u2026</p>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<div id="bottom-nav-mount"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
<script>
  const slug = Router.getParam('c');
  const wrap = document.getElementById('exams-page-wrap');

  Promise.all([App.getCourses(), Content.getExams(slug)]).then(([coursesData, examData]) => {
    App.mountShell('courses', slug);
    const course = coursesData.courses.find(c => c.slug === slug);

    if (!course) {
      App.setBreadcrumbs([{ label: 'Home', url: 'index.html' }, { label: 'Courses', url: 'courses.html' }, { label: 'Not found' }]);
      wrap.innerHTML = UI.emptyState('\u26a0\ufe0f', 'Course not found', 'Check the link and try again.');
      return;
    }

    App.setBreadcrumbs([{ label: 'Home', url: 'index.html' }, { label: course.code, url: Router.courseUrl(slug) }, { label: 'Exams' }]);
    document.title = `${course.code} Exams — MTH Notes`;

    const exams = examData.exams || [];
    const chapterExams = exams.filter(e => e.type === 'chapter');
    const mockExams = exams.filter(e => e.type === 'mock');

    function examCard(e) {
      return `
        <a class="tab-card" href="exam.html?c=${slug}&e=${e.id}" style="align-items:flex-start;">
          <span class="tc-icon" aria-hidden="true">${e.type === 'mock' ? '\ud83c\udfaf' : '\ud83d\udcdd'}</span>
          <span>
            <span class="tc-title">${UI.escapeHtml(e.title)}</span><br />
            <span class="tc-count">${e.totalMarks} marks \u00b7 ${e.recommendedMinutes} min \u00b7 <span class="difficulty-badge">${e.difficulty}</span></span>
          </span>
        </a>`;
    }

    wrap.innerHTML = `
      <div class="section-head" style="margin-top:0;"><h2>${UI.escapeHtml(course.code)} \u2014 Exams</h2></div>
      <p class="section-sub">Chapter exams for focused revision, and mock exams that mirror the real paper format.</p>

      <div class="section-head"><h2>Chapter Exams</h2></div>
      <div class="tab-cards">${chapterExams.length ? chapterExams.map(examCard).join('') : ''}</div>
      ${!chapterExams.length ? UI.emptyState('\ud83d\udcdd', 'No chapter exams yet', 'Chapter exams for this course haven\u2019t been built yet.') : ''}

      <div class="section-head"><h2>Mock Exams</h2></div>
      <div class="tab-cards">${mockExams.length ? mockExams.map(examCard).join('') : ''}</div>
      ${!mockExams.length ? UI.emptyState('\ud83c\udfaf', 'No mock exams yet', 'A full mock exam for this course hasn\u2019t been assembled yet.') : ''}
    `;
  }).catch(err => {
    console.error(err);
    wrap.innerHTML = UI.emptyState('\u26a0\ufe0f', 'Something went wrong', 'Could not load exam data.');
  });
</script>
</body>
</html>
