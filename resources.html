<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resources — MTH Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('mthnotes:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-nav="resources">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <main id="main-content" class="main-content">
      <div class="page-wrap">
        <div class="section-head" style="margin-top:0;">
          <h2 id="page-heading">Resources</h2>
        </div>
        <p class="section-sub" id="page-sub">Loading\u2026</p>

        <div class="filter-bar" id="course-filter-bar"></div>

        <div class="resource-list" id="resource-list"></div>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<div id="bottom-nav-mount"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
  const onlySlug = Router.getParam('c');
  let allResources = [];
  let activeCourse = onlySlug || 'all';

  function renderResources() {
    let list = allResources;
    if (activeCourse !== 'all') list = list.filter(x => x.course.slug === activeCourse);
    const el = document.getElementById('resource-list');
    el.innerHTML = list.length
      ? list.map(x => UI.resourceRow(x.r, x.course)).join('')
      : UI.emptyState('\ud83d\udcc4', 'No resources here yet', 'Add a resources.json file for this course to list PDFs and links.');
  }

  App.getCourses().then(async data => {
    App.mountShell('resources', onlySlug);

    const courses = onlySlug ? data.courses.filter(c => c.slug === onlySlug) : data.courses;
    const targetCourse = onlySlug ? data.courses.find(c => c.slug === onlySlug) : null;

    if (onlySlug && !targetCourse) {
      App.setBreadcrumbs([{ label: 'Home', url: 'index.html' }, { label: 'Resources', url: 'resources.html' }, { label: 'Not found' }]);
      document.getElementById('page-sub').textContent = 'Course not found.';
      return;
    }

    App.setBreadcrumbs(onlySlug
      ? [{ label: 'Home', url: 'index.html' }, { label: targetCourse.code, url: Router.courseUrl(onlySlug) }, { label: 'Resources' }]
      : [{ label: 'Home', url: 'index.html' }, { label: 'Resources' }]);

    document.getElementById('page-heading').textContent = onlySlug
      ? `${targetCourse.code} \u2014 Resources`
      : 'Resources';

    const withResources = courses.filter(c => c.resourceCount > 0);
    const results = await Promise.all(withResources.map(c =>
      fetch(Router.courseDataPath(c.slug, 'resources'))
        .then(r => (r.ok ? r.json() : { resources: [] }))
        .then(d => (d.resources || []).map(r => ({ r, course: c })))
        .catch(() => [])
    ));
    allResources = results.flat();

    document.getElementById('page-sub').textContent = allResources.length
      ? `${allResources.length} resource${allResources.length === 1 ? '' : 's'} across ${withResources.length} course${withResources.length === 1 ? '' : 's'}.`
      : 'No resources have been added yet.';

    const courseBar = document.getElementById('course-filter-bar');
    if (!onlySlug) {
      courseBar.innerHTML = ['<button class="filter-chip active" data-course="all">All Courses</button>']
        .concat(data.courses.filter(c => c.resourceCount > 0).map(c =>
          `<button class="filter-chip" data-course="${c.slug}">${UI.escapeHtml(c.code)}</button>`
        )).join('');
      courseBar.addEventListener('click', e => {
        const chip = e.target.closest('[data-course]');
        if (!chip) return;
        activeCourse = chip.getAttribute('data-course');
        document.querySelectorAll('#course-filter-bar .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
        renderResources();
      });
    } else {
      courseBar.style.display = 'none';
    }

    renderResources();
  });
</script>
</body>
</html>
