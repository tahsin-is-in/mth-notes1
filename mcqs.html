<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCQ Practice — MTH Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('mthnotes:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] } };
</script>
</head>
<body data-nav="mcqs">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <main id="main-content" class="main-content">
      <div class="page-wrap narrow">
        <div class="section-head" style="margin-top:0;"><h2 id="page-heading">MCQ Practice</h2></div>
        <p class="section-sub" id="page-sub">Loading\u2026</p>
        <div class="filter-bar" id="course-filter-bar"></div>
        <div id="mcq-list"></div>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<div id="bottom-nav-mount"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
<script>
  const onlySlug = Router.getParam('c');
  const onlyTopic = Router.getParam('t');
  let allMcqs = [];
  let activeCourse = onlySlug || 'all';

  function mcqBlock(m, i) {
    const opts = Object.entries(m.options || {});
    return `
      <div class="mcq-card" data-mcq-id="${m.id}">
        <div style="font-size:0.76rem; color:var(--ink-faint); margin-bottom:0.4rem;">${UI.escapeHtml(m.courseCode || '')}</div>
        <div class="mcq-prompt">${i + 1}. ${UI.escapeHtml(m.question)}</div>
        ${opts.map(([letter, text]) => `
          <div class="mcq-option" data-letter="${letter}" data-correct="${m.correct}">
            <span class="mcq-option-letter">${letter}</span><span>${UI.escapeHtml(text)}</span>
          </div>`).join('')}
        <div class="mcq-explain">
          <strong>Correct answer: ${m.correct}.</strong> ${UI.escapeHtml(m.explanation || '')}
          ${m.whyOthersWrong ? `<div class="mcq-why-wrong">${Object.entries(m.whyOthersWrong).map(([l,t]) => `<div><strong>${l}:</strong> ${UI.escapeHtml(t)}</div>`).join('')}</div>` : ''}
        </div>
      </div>`;
  }

  function render() {
    let list = allMcqs;
    if (activeCourse !== 'all') list = list.filter(m => m.courseSlug === activeCourse);
    if (onlyTopic) list = list.filter(m => m.topicId === onlyTopic);
    const el = document.getElementById('mcq-list');
    el.innerHTML = list.length
      ? list.map(mcqBlock).join('')
      : UI.emptyState('\u2753', 'No MCQs here yet', 'Try a different course filter.');

    document.querySelectorAll('.mcq-card').forEach(card => {
      card.querySelectorAll('.mcq-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const correct = opt.getAttribute('data-correct');
          card.querySelectorAll('.mcq-option').forEach(o => {
            o.classList.remove('correct', 'incorrect');
            if (o.getAttribute('data-letter') === correct) o.classList.add('correct');
          });
          if (opt.getAttribute('data-letter') !== correct) opt.classList.add('incorrect');
          card.querySelector('.mcq-explain').classList.add('show');
        });
      });
    });

    if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]);
  }

  App.getCourses().then(async data => {
    App.mountShell('mcqs', onlySlug);
    App.setBreadcrumbs(onlySlug
      ? [{ label: 'Home', url: 'index.html' }, { label: (data.courses.find(c=>c.slug===onlySlug)||{}).code || onlySlug, url: Router.courseUrl(onlySlug) }, { label: 'MCQ Practice' }]
      : [{ label: 'Home', url: 'index.html' }, { label: 'MCQ Practice' }]);

    const courses = onlySlug ? data.courses.filter(c => c.slug === onlySlug) : data.courses;
    const results = await Promise.all(courses.map(c =>
      Content.getMcqs(c.slug).then(d => (d.mcqs || []).map(m => Object.assign({ courseSlug: c.slug, courseCode: c.code }, m)))
    ));
    allMcqs = results.flat();

    document.getElementById('page-sub').textContent = allMcqs.length
      ? `${allMcqs.length} multiple-choice question${allMcqs.length === 1 ? '' : 's'} available. Click an option to check your answer.`
      : 'No MCQs have been added yet.';

    if (!onlySlug) {
      const withMcqs = data.courses.filter(c => allMcqs.some(m => m.courseSlug === c.slug));
      const bar = document.getElementById('course-filter-bar');
      bar.innerHTML = ['<button class="filter-chip active" data-course="all">All Courses</button>']
        .concat(withMcqs.map(c => `<button class="filter-chip" data-course="${c.slug}">${UI.escapeHtml(c.code)}</button>`)).join('');
      bar.addEventListener('click', e => {
        const chip = e.target.closest('[data-course]');
        if (!chip) return;
        activeCourse = chip.getAttribute('data-course');
        document.querySelectorAll('#course-filter-bar .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
        render();
      });
    }

    render();
  });
</script>
</body>
</html>
