<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Important Questions — MTH Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%88%91%3C/text%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('mthnotes:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-nav="questions">
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="topbar-mount"></div>
    <main id="main-content" class="main-content">
      <div class="page-wrap">
        <div class="section-head" style="margin-top:0;">
          <h2 id="page-heading">Important Questions</h2>
        </div>
        <p class="section-sub" id="page-sub">Loading\u2026</p>

        <div class="filter-bar" id="course-filter-bar"></div>
        <div class="filter-bar" id="category-filter-bar"></div>

        <div class="question-list" id="question-list"></div>
      </div>
    </main>
    <div id="footer-mount"></div>
  </div>
</div>
<div id="bottom-nav-mount"></div>

<script src="js/storage.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<script>
  const onlySlug = Router.getParam('c');
  let allQuestions = []; // { q, course }
  let activeCourse = onlySlug || 'all';
  let activeCategory = 'all';

  const CATEGORY_ORDER = ['short', 'definition', 'theorem', 'proof', 'problem', 'previous', 'viva', 'important'];
  const CATEGORY_LABELS = {
    short: 'Short', definition: 'Definitions', theorem: 'Theorems', proof: 'Proofs',
    problem: 'Problems', previous: 'Previous Questions', viva: 'Viva', important: 'Important'
  };

  function renderFilters(courses) {
    const courseBar = document.getElementById('course-filter-bar');
    if (!onlySlug) {
      courseBar.innerHTML = ['<button class="filter-chip active" data-course="all">All Courses</button>']
        .concat(courses.filter(c => c.questionCount > 0).map(c =>
          `<button class="filter-chip" data-course="${c.slug}">${UI.escapeHtml(c.code)}</button>`
        )).join('');
    } else {
      courseBar.style.display = 'none';
    }

    const categoriesPresent = [...new Set(allQuestions.map(x => x.q.category))];
    const catBar = document.getElementById('category-filter-bar');
    catBar.innerHTML = ['<button class="filter-chip active" data-cat="all">All Types</button>']
      .concat(CATEGORY_ORDER.filter(c => categoriesPresent.includes(c)).map(c =>
        `<button class="filter-chip" data-cat="${c}">${CATEGORY_LABELS[c] || c}</button>`
      )).join('');
  }

  function renderQuestions() {
    let list = allQuestions;
    if (activeCourse !== 'all') list = list.filter(x => x.course.slug === activeCourse);
    if (activeCategory !== 'all') list = list.filter(x => x.q.category === activeCategory);

    const el = document.getElementById('question-list');
    el.innerHTML = list.length
      ? list.map(x => UI.questionCard(x.q, x.course)).join('')
      : UI.emptyState('\u2753', 'No questions here yet', 'Add a questions.json file for this course to build its question bank.');
  }

  App.getCourses().then(async data => {
    App.mountShell('questions', onlySlug);

    const courses = onlySlug ? data.courses.filter(c => c.slug === onlySlug) : data.courses;
    const targetCourse = onlySlug ? data.courses.find(c => c.slug === onlySlug) : null;

    if (onlySlug && !targetCourse) {
      App.setBreadcrumbs([{ label: 'Home', url: 'index.html' }, { label: 'Questions', url: 'questions.html' }, { label: 'Not found' }]);
      document.getElementById('page-sub').textContent = 'Course not found.';
      return;
    }

    App.setBreadcrumbs(onlySlug
      ? [{ label: 'Home', url: 'index.html' }, { label: targetCourse.code, url: Router.courseUrl(onlySlug) }, { label: 'Questions' }]
      : [{ label: 'Home', url: 'index.html' }, { label: 'Important Questions' }]);

    document.getElementById('page-heading').textContent = onlySlug
      ? `${targetCourse.code} \u2014 Important Questions`
      : 'Important Questions';

    const withQuestions = courses.filter(c => c.questionCount > 0);
    const results = await Promise.all(withQuestions.map(c =>
      fetch(Router.courseDataPath(c.slug, 'questions'))
        .then(r => (r.ok ? r.json() : { questions: [] }))
        .then(d => (d.questions || []).map(q => ({ q, course: c })))
        .catch(() => [])
    ));
    allQuestions = results.flat();

    document.getElementById('page-sub').textContent = allQuestions.length
      ? `${allQuestions.length} question${allQuestions.length === 1 ? '' : 's'} across ${withQuestions.length} course${withQuestions.length === 1 ? '' : 's'}.`
      : 'No questions have been added yet.';

    renderFilters(data.courses);
    renderQuestions();

    document.getElementById('course-filter-bar').addEventListener('click', e => {
      const chip = e.target.closest('[data-course]');
      if (!chip) return;
      activeCourse = chip.getAttribute('data-course');
      document.querySelectorAll('#course-filter-bar .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderQuestions();
    });
    document.getElementById('category-filter-bar').addEventListener('click', e => {
      const chip = e.target.closest('[data-cat]');
      if (!chip) return;
      activeCategory = chip.getAttribute('data-cat');
      document.querySelectorAll('#category-filter-bar .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderQuestions();
    });
  });
</script>
</body>
</html>
